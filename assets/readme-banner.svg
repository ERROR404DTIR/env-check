<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Env Check</title><desc id="d">Environment variable keys are compared and verified.</desc><defs><linearGradient id="bg"><stop stop-color="#1b2639"/><stop offset="1" stop-color="#0a111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g font-family="monospace" font-size="18"><g fill="#91a0ba"><text x="105" y="112">API_KEY</text><text x="105" y="162">DATABASE_URL</text><text x="105" y="212">DEBUG</text></g><g fill="#62e3c1"><text x="485" y="112">PRESENT</text><text x="485" y="162">PRESENT</text><text x="485" y="212">EMPTY</text></g></g><path d="M385 95V225" stroke="#42536c" stroke-width="2" stroke-dasharray="5 7"/><g fill="none" stroke="#62e3c1" stroke-width="3"><circle cx="900" cy="150" r="68"/><path d="M865 150L890 175L940 118" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="stroke-dasharray" values="0 130;130 0" dur="2.8s" repeatCount="indefinite"/></path></g><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">ENV CHECK</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">COMPARE / VALIDATE / REPORT</text></svg>